<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelotita Loca</title>
    <style>
        /* Reset: sin margenes ni scroll; el canvas llena la ventana sin borde */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #10121f;
        }
        canvas {
            display: block;
            border: none;
        }
        #titulo {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            z-index: 10;
            font-family: sans-serif;
            color: #ffffff;
            pointer-events: none; /* deja pasar los clics al canvas */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script> 
    <!-- p5.sound 0.2.x es la version compatible con p5.js 2.x -->
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.2.0/dist/p5.sound.min.js"></script>
    <script src="sketch.js"></script>
</head>
<body>
    <h1 id="titulo">Pelotita Loca</h1>
</body>
</html>
